{% extends "admin/base.html" %}
{% block body %}
<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark" style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#b23e00);font-size:1.15rem">♫</span>
      <div>
        <div class="brand-name">{{ mu_config.app_name }}</div>
        <div class="brand-sub">Account</div>
      </div>
    </div>
    <div class="card" style="text-align:center">
      <div style="font-size:2.4rem;line-height:1;margin-bottom:14px">✓</div>
      <h1>{{ heading }}</h1>
      <p style="color:var(--muted);margin:10px 0 22px">{{ message }}</p>
      <a class="btn primary" href="{{ action_url }}">{{ action_label }}</a>
    </div>
  </div>
</div>
{% endblock %}
