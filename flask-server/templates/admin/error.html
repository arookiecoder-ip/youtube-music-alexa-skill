{% extends "admin/base.html" %}
{% block body %}
<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark" style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#b23e00);font-size:1.15rem">♫</span>
      <div>
        <div class="brand-name">{{ mu_config.app_name }}</div>
        <div class="brand-sub">Admin</div>
      </div>
    </div>
    <div class="card" style="text-align:center">
      <div class="stat-label" style="margin-bottom:8px">Error {{ status }}</div>
      <h1 style="font-size:2rem;margin-bottom:10px">{{ status }}</h1>
      <p style="color:var(--muted);margin:0 0 22px">{{ message }}</p>
      <div class="btn-row" style="justify-content:center">
        <a class="btn primary" href="{{ base_path }}/">Back to dashboard</a>
        <a class="btn ghost" href="{{ base_path }}/login/">Sign in</a>
      </div>
    </div>
    <div class="login-foot">
      If this keeps happening, check the server logs for the request ID.
    </div>
  </div>
</div>
{% endblock %}
