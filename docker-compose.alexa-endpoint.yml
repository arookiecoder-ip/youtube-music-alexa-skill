# Optional persistent ASK compute service; DynamoDB remains inside Lambda.
services:
  alexa-skill:
    image: ${MUSICBOX_SKILL_IMAGE:?set a reviewed endpoint image}
    container_name: musicbox-alexa-skill
    restart: unless-stopped
    init: true
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1
    pids_limit: 64
    tmpfs: ['/tmp:size=16m,mode=1777']
    env_file: ${MUSICBOX_SKILL_ENV_FILE:?set private endpoint env file}
    networks: [web]
    volumes:
      - ${MUSICBOX_SKILL_STATE_DIR:?set private owned state directory}:/state
