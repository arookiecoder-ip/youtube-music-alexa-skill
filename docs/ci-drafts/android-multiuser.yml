name: Android Multi-User Build

# Dedicated multi-user verification using the existing protected signing secret.
on:
  push:
    branches:
      - feat/multi-user
  workflow_dispatch:
    inputs:
      ui_tests:
        description: Build and run the account UI regressions on an emulator
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-multiuser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare the protected APK signing identity
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -eu
          umask 077
          signing_store="$HOME/.android/music-box-debug.keystore"
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo "Configure the protected signing secret."; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$signing_store"
          keytool -exportcert -keystore "$signing_store" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/music-box-cert.der" >/dev/null
          sha256sum "$RUNNER_TEMP/music-box-cert.der" | cut -d ' ' -f 1 > signing-certificate.sha256
          cmp .github/signing/debug-certificate.sha256 signing-certificate.sha256
          echo "MUSIC_BOX_SIGNING_STORE=$signing_store" >> "$GITHUB_ENV"

      - name: Generate local.properties
        run: |
          cat > local.properties <<EOF
          POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
          MULTIUSER_SESSION_BASE_URL=https://testalexa.synthora.in
          MULTIUSER_BASE_URL=https://testalexa.synthora.in
          EOF

      - name: Compile and run JVM regressions
        run: sh ./gradlew testDebugUnitTest --no-daemon

      - name: Compile the instrumented account/UI tests
        if: ${{ github.event_name == 'push' || inputs.ui_tests == true }}
        run: sh ./gradlew assembleDebugAndroidTest --no-daemon

      - name: Enable KVM for emulator verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run account access and UI regressions on Android
        if: ${{ github.event_name == 'push' || inputs.ui_tests == true }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: sh ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=in.synthora.musicbox.AlexaAccessUiTest,in.synthora.musicbox.AccountUiRegressionTest,in.synthora.musicbox.DownloadCookieUiTest --no-daemon

      - name: Build the signed debug APK
        run: sh ./gradlew assembleDebug --no-daemon

      - name: Verify APK entry points
        run: python3 scripts/verify_apk_components.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiuser-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/outputs/androidTest-results
            app/build/reports/androidTests

      - name: Upload APK and signing fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: multiuser-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            signing-certificate.sha256

      - name: Remove private signing material
        if: always()
        run: rm -f "$HOME/.android/music-box-debug.keystore"
