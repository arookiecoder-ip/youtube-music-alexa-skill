name: Alexa playback regressions
on:
  pull_request:
    paths: ['flask-server/**', 'lambda/**', 'scripts/run-regressions.py', '.github/workflows/alexa-regressions.yml']
  push:
    branches: [master]
    paths: ['flask-server/**', 'lambda/**', 'scripts/run-regressions.py', '.github/workflows/alexa-regressions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playback-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            flask-server/requirements.txt
            lambda/requirements.txt
      - run: python -m pip install -r flask-server/requirements.txt -r lambda/requirements.txt pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Persistent YouTube streaming client regressions
        working-directory: flask-server/youtube-stream
        run: |
          npm ci --ignore-scripts
          npm test
      - name: All isolated server and web logic regressions
        run: python scripts/run-regressions.py --results test-results
      - name: Upload server and web regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-web-regressions
          path: test-results/
      - name: Skill controllers and real SDK serialization
        run: python -m unittest discover -s lambda/tests -p 'test_*.py' -q
      - name: Python compilation
        run: python -m compileall -q flask-server lambda browser-auth network-egress scripts

  status-dashboard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATUS_SCREENSHOT_DIR: ${{ github.workspace }}/status-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            flask-server/requirements.txt
            flask-server/tests/requirements-status.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r flask-server/requirements.txt -r flask-server/tests/requirements-status.txt
      # Hosted Ubuntu runners already include Chromium runtime libraries.
      # Avoid unrelated apt upgrades/fonts downloads before every browser test.
      - run: python -m playwright install chromium
      - name: Status metrics, access control and failure paths
        working-directory: flask-server
        env:
          PYTHONPATH: tests:.
        run: python -m unittest discover -s tests -p 'test_status*.py' -q
      - name: Dashboard refresh and visibility behavior
        run: |
          node --check flask-server/templates/static/js/status.js
          node --check flask-server/templates/static/js/status-activity.js
          node flask-server/tests/test_status_ui.js
      - name: Desktop and mobile Chromium checks
        run: python -m pytest -q flask-server/tests/browser/test_status_dashboard.py flask-server/tests/browser/test_collection_playback.py flask-server/tests/browser/test_shared_playback_feedback.py flask-server/tests/browser/test_progress_hit_area.py flask-server/tests/browser/test_artist_collections.py flask-server/tests/browser/test_account_signin.py --junitxml=status-artifacts/browser-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-dashboard-test-results
          path: status-artifacts/
          if-no-files-found: ignore

  container-build:
    needs: [playback-tests, status-dashboard-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image in Actions only
        uses: docker/build-push-action@v6
        with:
          context: flask-server
          load: true
          push: false
          tags: musicbox-realtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check real gateway startup, public HTTP and stream authorization
        run: |
          docker run -d --name musicbox-ci -p 127.0.0.1:5000:5000 \
            -e YOUTUBE_STREAMING=0 -e SECRET_KEY=isolated-ci-secret \
            -e REMOTE_USER=ci-owner -e REMOTE_PASSWORD=isolated-ci-password \
            -e DB_FILE=/tmp/musicbox.db -e AUDIO_CACHE_DIR=/tmp/audio musicbox-realtime:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/manifest.webmanifest >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5000/manifest.webmanifest >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5000/api/app/events/)" = 401
      - name: Verify real signed-session event delivery and revocation
        run: docker exec musicbox-ci python tests/smoke_realtime_gateway.py
      - name: Container diagnostics
        if: always()
        run: docker logs musicbox-ci || true
