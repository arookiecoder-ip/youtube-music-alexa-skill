name: Jam backend build and regressions
on:
  push:
    branches: [feat/jam-sessions]
    paths: ['flask-server/**', '.github/workflows/jam-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jam-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-tests.lock
      - name: Jam membership, authorization, queue races and playback clock
        env:
          PYTHONPATH: flask-server:flask-server/tests
        run: python -m unittest test_jam_rooms test_jam_routes -v
      - name: Install Chromium on the GitHub runner
        run: python -m playwright install chromium
      - name: Browser consent, host output selection, removal and responsive layouts
        env:
          PYTHONPATH: flask-server:flask-server/tests
          JAM_SCREENSHOTS: jam-screenshots
        run: python -m unittest test_jam_browser -v
      - name: Upload Jam UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jam-ui-screenshots
          path: jam-screenshots/
      - name: Existing account and playback isolation regressions
        env:
          PYTHONPATH: flask-server:flask-server/tests
        run: python -m unittest test_security_boundaries test_mobile_devices test_mobile_device_routes test_local_library test_playback_lock_contract -v
      - name: Validate backend and browser source
        run: |
          python -m compileall -q flask-server
          node --check flask-server/templates/static/js/jam-room.js
          node --check flask-server/templates/static/js/device.js
      - name: Build backend image on GitHub runner
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t "musicbox-jam:$GITHUB_SHA" flask-server
          docker save "musicbox-jam:$GITHUB_SHA" | gzip -1 > jam-backend.tar.gz
          sha256sum jam-backend.tar.gz > jam-backend.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jam-backend-image
          path: |
            jam-backend.tar.gz
            jam-backend.tar.gz.sha256
          compression-level: 0
          retention-days: 7
