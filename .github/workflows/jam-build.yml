name: Jam backend build and regressions
on:
  push:
    branches: [feat/jam-sessions, fix/jam-playback-session, codex/alexa-backend-retries, codex/jam-shared-devices]
    paths: ['flask-server/**', 'scripts/**', '.github/workflows/jam-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jam-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-tests.lock
      - name: Deployment environment file integrity
        run: python -m unittest discover -s scripts/tests -p 'test_deploy_env_format.py' -v
      - name: Jam membership, authorization, queue races and playback clock
        env:
          PYTHONPATH: flask-server:flask-server/tests
        run: python -m unittest test_jam_rooms test_jam_routes test_jam_echo -v
      - name: Playback ownership, active sessions, outage classification and resume startup
        env:
          PYTHONPATH: flask-server:flask-server/tests
        run: |
          for suite in test_app_queue test_active_session_renewal test_session_validation_outage test_alexa_startup_bundle test_alexa_logged_out test_alexa_authentication_stop test_transport_resume_latency test_alexa_transport test_direct_alexa_commands test_echo_presence_cache test_resume_after_pause; do
            python -m pytest -q "flask-server/tests/$suite.py" || exit 1
          done
      - name: Skill resume and real SDK authorization regressions
        run: python -m unittest discover -s lambda/tests -p 'test_*.py' -q
      - name: Install Chromium on the GitHub runner
        run: python -m playwright install chromium
      - name: Browser consent, host output selection, removal and responsive layouts
        env:
          PYTHONPATH: flask-server:flask-server/tests
          JAM_SCREENSHOTS: jam-screenshots
        run: python -m unittest discover -s flask-server/tests/browser -p 'test_jam_room.py' -v
      - name: Upload Jam UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jam-ui-screenshots
          path: jam-screenshots/
      - name: Existing account and playback isolation regressions
        env:
          PYTHONPATH: flask-server:flask-server/tests
        run: python -m unittest test_security_boundaries test_mobile_devices test_mobile_device_routes test_local_library test_playback_lock_contract -v
      - name: Validate backend and browser source
        run: |
          python -m compileall -q flask-server
          node --check flask-server/templates/static/js/jam-room.js
          node --check flask-server/templates/static/js/device.js
      - name: Package matching Alexa skill sources
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('jam-skill-source.zip','w',ZIP_DEFLATED) as archive:
              for path in Path('lambda').rglob('*'):
                  if path.is_file() and not any(part in ('tests','__pycache__') for part in path.parts):
                      archive.write(path,path.relative_to('lambda'))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jam-skill-source
          path: jam-skill-source.zip
      - name: Build backend image on GitHub runner
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t "musicbox-jam:$GITHUB_SHA" flask-server
          docker save "musicbox-jam:$GITHUB_SHA" | gzip -1 > jam-backend.tar.gz
          sha256sum jam-backend.tar.gz > jam-backend.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jam-backend-image
          path: |
            jam-backend.tar.gz
            jam-backend.tar.gz.sha256
          compression-level: 0
          retention-days: 7
