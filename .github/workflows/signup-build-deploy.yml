name: Signup backend build and deployment

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested prebuilt image to the multi-user test server
        type: boolean
        default: true
  push:
    branches: [fix/signup-flow, feat/multi-user]
    paths:
      - flask-server/**
      - .github/workflows/signup-build-deploy.yml
      - scripts/deploy-prebuilt-backend.py

permissions:
  contents: read

concurrency:
  group: signup-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-tests.lock
      - name: Signup and account security regressions
        env:
          PYTHONPATH: flask-server:flask-server/tests
        run: python -m unittest discover -s flask-server/tests -p 'test_selfservice.py'
      - name: Staged signup protocol regressions
        env:
          PYTHONPATH: flask-server:flask-server/tests
        run: python -m unittest discover -s flask-server/tests -p 'test_signup_steps.py'
      - name: Account isolation, staging sync and retention regressions
        env:
          PYTHONPATH: flask-server:flask-server/tests
        run: |
          for suite in test_local_library test_staged_library_routes test_mobile_devices test_mobile_device_routes test_youtube_server_session test_security_boundaries test_account_purge test_current_audio test_playback_lock_contract; do
            python -m unittest "$suite" || exit 1
          done
      - name: Compile the backend image on the GitHub runner
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "musicbox-signup:$GITHUB_SHA" flask-server
          docker save "musicbox-signup:$GITHUB_SHA" | gzip -1 > backend.tar.gz
          sha256sum backend.tar.gz > backend.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signup-backend-image
          path: |
            backend.tar.gz
            backend.tar.gz.sha256
          compression-level: 0
          retention-days: 7

  deploy:
    if: ${{ (github.ref == 'refs/heads/fix/signup-flow' || github.ref == 'refs/heads/feat/multi-user') && (github.event_name == 'push' || inputs.deploy) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signup-backend-image
      - name: Check transport credentials and artifact integrity
        env:
          DEPLOY_KEY: ${{ secrets.MUSICBOX_DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.MUSICBOX_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" || { echo 'Configure MUSICBOX_DEPLOY_SSH_KEY'; exit 1; }
          test -n "$DEPLOY_HOST_KEYS" || { echo 'Configure MUSICBOX_DEPLOY_KNOWN_HOSTS'; exit 1; }
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_HOST_KEYS" > "$RUNNER_TEMP/deploy_known_hosts"
          sha256sum --check backend.tar.gz.sha256
      - name: Deploy the prebuilt image without any server-side build
        env:
          DEPLOY_HOST: ${{ secrets.MUSICBOX_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MUSICBOX_DEPLOY_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts" \
            -i "$RUNNER_TEMP/deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $GITHUB_SHA" < backend.tar.gz
      - name: Verify public application and proxy authentication
        run: |
          set -eu
          test "$(curl -A 'Mozilla/5.0 MusicBox-CI/1.0' -sS -o /dev/null -w '%{http_code}' https://testalexa.synthora.in/health/ready)" = 200
          test "$(curl -A 'Mozilla/5.0 MusicBox-CI/1.0' -sS -o /dev/null -w '%{http_code}' https://testalexa.synthora.in/alexa/proxy/)" = 401
      - name: Remove ephemeral SSH private key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
